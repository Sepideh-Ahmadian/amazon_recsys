[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon_recsys"
version = "0.1.0"
description = "Does LLM review enrichment, checked by a Jev judge, improve graph-based recommendation?"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "pandera==0.20.4",
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "typer==0.12.5",
    "click==8.1.7",  # typer 0.12 is incompatible with click >= 8.2
    "python-dotenv==1.0.1",
    "torch==2.4.1",
    "torch-geometric==2.6.1",
    "pykeen==1.10.2",
    "class-resolver==0.3.10",  # >= 0.8 breaks with the typing_extensions that typesafe-sdk needs
    "setuptools==75.1.0",  # pykeen 1.10 imports pkg_resources, which uv venvs do not ship
    "openai==1.51.2",
    "httpx==0.27.2",  # openai 1.51 passes `proxies=`, removed in httpx >= 0.28
    "typesafe-sdk==0.6.0",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "hypothesis==6.115.3",
    "ruff==0.7.0",
]

[project.scripts]
recsys = "amazon_recsys.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "legacy", "data", "runs", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "slow: takes more than ~5 s; excluded from `make test`",
    "integration: calls a real API (Azure or Jev); needs RUN_INTEGRATION=1 and keys",
]
